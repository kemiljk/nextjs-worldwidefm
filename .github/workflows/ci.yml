name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check upload pipeline
        run: bunx tsc -p tsconfig.upload.json --noEmit

      - name: Type check tests
        run: bunx tsc -p tsconfig.test.json --noEmit

      - name: Unit and integration tests
        run: bun run test

      - name: Node upload streaming regressions
        env:
          WWFM_SLOW_UPLOAD: '1'
        run: bun run test:uploads

  live-search-credentials:
    # Secrets are empty for forked pull requests and Dependabot, so the live job skips there.
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          BUCKET: ${{ secrets.COSMIC_BUCKET_SLUG }}
          READ_KEY: ${{ secrets.COSMIC_READ_KEY }}
        run: |
          if [ -n "$BUCKET" ] && [ -n "$READ_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Set COSMIC_BUCKET_SLUG and COSMIC_READ_KEY secrets to run live search e2e."
          fi

  live-search:
    needs: live-search-credentials
    if: needs.live-search-credentials.outputs.available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_COSMIC_BUCKET_SLUG: ${{ secrets.COSMIC_BUCKET_SLUG }}
      COSMIC_READ_KEY: ${{ secrets.COSMIC_READ_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Live search e2e (read-only Cosmic)
        run: bun run test:e2e:live
